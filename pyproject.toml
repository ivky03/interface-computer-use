[project]
name = "interface-cua"
version = "0.1.0"
description = "Record-once, replay-many computer-use capability system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "playwright>=1.45",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cua = "cua.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cua"]
